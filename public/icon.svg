<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="65%" stop-color="#1a2146"/>
      <stop offset="100%" stop-color="#2c2444"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternFill" cx="48%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="210" fill="url(#halo)"/>
  <!-- Stars -->
  <circle cx="110" cy="108" r="4" fill="#fef3c7" opacity="0.8"/>
  <circle cx="408" cy="120" r="3.5" fill="#fef3c7" opacity="0.75"/>
  <circle cx="372" cy="88" r="2.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="144" cy="158" r="2.5" fill="#fde68a" opacity="0.6"/>
  <!-- Wire -->
  <path d="M 36 102 Q 256 150 476 102" fill="none" stroke="#3c355c" stroke-width="6" stroke-linecap="round"/>
  <!-- Lantern hanger -->
  <line x1="256" y1="126" x2="256" y2="156" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <!-- Top cap -->
  <rect x="206" y="150" width="100" height="22" rx="8" fill="#2c1810"/>
  <!-- Lantern body -->
  <ellipse cx="256" cy="264" rx="108" ry="104" fill="url(#lanternFill)"/>
  <!-- Lantern ribs -->
  <ellipse cx="256" cy="264" rx="68" ry="102" fill="none" stroke="#9a3412" stroke-opacity="0.35" stroke-width="4"/>
  <ellipse cx="256" cy="264" rx="28" ry="103" fill="none" stroke="#9a3412" stroke-opacity="0.3" stroke-width="3.5"/>
  <path d="M 155 224 Q 256 244 357 224" fill="none" stroke="#9a3412" stroke-opacity="0.3" stroke-width="4"/>
  <path d="M 152 266 Q 256 286 360 266" fill="none" stroke="#9a3412" stroke-opacity="0.3" stroke-width="4"/>
  <path d="M 162 308 Q 256 326 350 308" fill="none" stroke="#9a3412" stroke-opacity="0.3" stroke-width="4"/>
  <!-- Bottom cap -->
  <rect x="212" y="356" width="88" height="20" rx="8" fill="#2c1810"/>
  <!-- Tassel -->
  <line x1="256" y1="376" x2="256" y2="432" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="390" r="9" fill="#fbbf24"/>
</svg>
